name: Flutter CI

# 💡 設定觸發時機：只要有人推上 main 分支，或者開 Pull Request，機器人就會自動開工
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # 使用 GitHub 免費提供的最新 Ubuntu 虛擬伺服器
    runs-on: ubuntu-latest

    steps:
      # 1. 檢查並載入我們在 GitHub 上的程式碼
      - uses: actions/checkout@v4

      # 2. 安裝 Java 環境（Flutter 編譯所需的地基）
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 安裝最新穩定版的 Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. 讓機器人下載專案需要的套件
      - name: Install dependencies
        run: flutter pub get

      # 5. 自動生成 Riverpod 的程式碼（task_controller.g.dart）
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # 6. ✨ 外商核心：靜態代碼檢查（語法有沒有寫錯、排版好不好看）
      - name: Analyze code style
        run: flutter analyze

      # 7. ✨ 外商核心：自動執行單元測試（雖然我們還沒寫，但架構先擺好！）
      - name: Run unit tests
        run: flutter test

      - name: Verify Android app bundle build
        run: flutter build appbundle
